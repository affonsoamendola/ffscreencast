[package]
name = "ffscreencast"
version = "0.1.6"
edition = "2021"
rust-version = "1.85"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webrtc = "0.20"
rtc = "0.20"
nvenc = "0.1"
axum = "0.8"
tray-icon = "0.21"
arboard = "3"
windows-sys = { version = "0.60", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Com"] }
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dxgi", "Win32_Graphics_Gdi", "Win32_Foundation"] }
bytes = "1"
async-trait = "0.1"
rand = "0.10"
wasapi = "0.23"
opus-rs = "0.1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
semver = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
